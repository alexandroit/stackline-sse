name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  quality:
    name: Quality and release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 20.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run test:attw
      - run: npm run audit:dependencies
      - name: Build immutable release artifact
        shell: bash
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          (cd release && sha512sum *.tgz > SHA512SUMS)
          npm sbom --omit=dev --sbom-format=cyclonedx > release/sbom.cdx.json
          npm run docs:build
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf release/documentation.tgz -C site-dist .
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stackline-sse-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  node-runtime:
    name: Node.js ${{ matrix.node }} exact artifact
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [14.17.6, 16.20.2, 18.20.8, 20.20.0, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stackline-sse-release
          path: release
      - name: Clean install and execute
        env:
          SKIP_INSTALL_AUDIT: 1
        run: node scripts/smoke-install.mjs release

  operating-system:
    name: ${{ matrix.os }} exact artifact
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stackline-sse-release
          path: release
      - name: Clean install and execute
        env:
          SKIP_INSTALL_AUDIT: 1
        run: node scripts/smoke-install.mjs release

  typescript:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: [3.9.10, 4.7.4, 4.9.5, 5.9.3, 6.0.2, 7.0.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: node scripts/test-types.mjs ${{ matrix.typescript }}

  deno:
    name: Deno ${{ matrix.deno }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deno: [v1.46.3, v2.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}
      - run: deno run test/runtime-portable.mjs

  bun:
    name: Bun current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun run test/runtime-portable.mjs
