name: Bug report
description: Report incorrect parsing, encoding, streaming or runtime behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security reports, use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Browser
        - Node.js
        - Deno
        - Bun
        - Edge runtime
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small stream and the code needed to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
